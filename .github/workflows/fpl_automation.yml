name: Automated FPL Predictor Run

on:
  schedule:
    # Runs every Friday at 08:00 UTC (before standard weekend deadlines)
    - cron: '0 8 * * 5'
  workflow_dispatch: # Allows manual triggers from the GitHub Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbconvert ipykernel

      - name: Execute Prediction Notebook
        run: |
          jupyter nbconvert --to notebook --execute fpl_predictor_pipeline.ipynb --inplace

      - name: Commit and Push Updated Predictions
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add next_gw_predictions.csv fpl_xgboost_model.pkl
          git commit -m "Auto-update FPL predictions for upcoming gameweek [skip ci]" || echo "No changes to commit"
          git push